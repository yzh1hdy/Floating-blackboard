<!-- 0) 关闭前卸载守卫：拦截一切 beforeunload 注册，消除“是否离开网站”弹窗（必须先于主引擎加载） -->
<script>
(function () {
  var origAdd = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function (type, fn, opts) {
    if (typeof type === 'string' && type.toLowerCase() === 'beforeunload') {
      return undefined; // 丢弃 beforeunload 注册，浏览器不再提示离开
    }
    return origAdd.call(this, type, fn, opts);
  };
  window.onbeforeunload = null;
})();
</script>

<!-- 1) 本地中文语言包（必须先于主引擎加载，避免联网请求语言文件） -->
<script src="./zh-CN.js"></script>

<!-- 2) 离线网络守卫：拦截一切 http(s) 远程请求，保证纯本地运行；不产生弹窗与横幅 -->
<script>
(function () {
  function isRemote(url) {
    if (typeof url !== 'string') return false;
    return /^https?:\/\//i.test(url);
  }
  // fetch
  if (window.fetch) {
    var nativeFetch = window.fetch;
    window.fetch = function (input, init) {
      var u = (input && input.url) ? input.url : input;
      if (isRemote(u)) return Promise.reject(new Error('offline: blocked ' + u));
      return nativeFetch.apply(this, arguments);
    };
  }
  // XHR
  var nativeOpen = XMLHttpRequest.prototype.open;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__offlineBlocked = isRemote(url);
    return nativeOpen.apply(this, arguments);
  };
  var nativeSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.send = function () {
    if (this.__offlineBlocked) {
      this.__offlineBlocked = false;
      setTimeout(function () { try { this.dispatchEvent(new Event('error')); } catch (e) {} }.bind(this), 0);
      return;
    }
    return nativeSend.apply(this, arguments);
  };
  // 上报信标
  if (navigator.sendBeacon) navigator.sendBeacon = function () { return false; };
  // 静默引擎内部非致命异常
  window.addEventListener('unhandledrejection', function (e) { e.preventDefault(); });
})();
</script>

<!-- 5) 启动后定制：兜底移除在线功能节点、顶栏、表达式顶部栏与工具按钮；保证键盘常驻 -->
<script>
(function () {
  var SELECTORS = [
    '.dcg-login',
    '.dcg-action-save',
    '.dcg-action-share',
    '.dcg-action-help',
    '.dcg-action-preferences',
    '.dcg-action-opendrawer',
    '.dcg-notice--authenticate',
    '.dcg-expressions-branding',
    '.dcg-graphpaper-branding',
    '.dcg-current-tool-container',
    '#dcg-header-container',
    '.dcg-expression-top-bar',
    '.dcg-graphpaper-toolbar'
  ];
  function cleanup() {
    SELECTORS.forEach(function (sel) {
      document.querySelectorAll(sel).forEach(function (n) {
        // 不触碰紧凑输入计算器（#dcgInputCalc）内部节点
        if (n.closest && n.closest('#dcgInputCalc')) return;
        n.remove();
      });
    });
    document.querySelectorAll('.dcg-home-link').forEach(function (a) {
      a.removeAttribute('href');
      a.style.pointerEvents = 'none';
    });
    var keys = document.querySelector('.dcg-keys-container');
    if (keys) {
      keys.style.opacity = '1';
      keys.style.transform = 'none';
      keys.removeAttribute('aria-hidden');
    }
    window.onbeforeunload = null;
  }
  var timer = setInterval(cleanup, 350);
  setTimeout(function () { clearInterval(timer); cleanup(); }, 10000);
  window.addEventListener('load', cleanup);
})();
</script>

<!-- 6) 白板桥接：底部输入条内的本地 desmos（文本框 + 键盘）。读取本页输入计算器的表达式，
     用离屏计算器渲染成透明背景/无网格/白色曲线后回传给白板插入。 -->
<script>
(function () {
  var inputCalc = null;
  var initStarted = false;

  // 引擎加载后初始化紧凑输入计算器（文本框 + 键盘），直接持有实例引用，不依赖整页应用
  function initInputCalc() {
    if (window.__dcgWidgetMode) return; // widget 模式不创建带键盘的输入计算器
    if (initStarted) return;
    initStarted = true;
    var tries = 0;
    var iv = setInterval(function () {
      tries++;
      var el = document.getElementById('dcgInputCalc');
      if (el && window.Desmos && typeof window.Desmos.GraphingCalculator === 'function') {
        clearInterval(iv);
        try {
          inputCalc = window.Desmos.GraphingCalculator(el, {
            expressions: true,
            keypadAlwaysVisible: true,
            settings: {
              backgroundColor: '#0b0e14',
              gridColor: '#1c2230',
              xAxisNumbers: true,
              yAxisNumbers: true
            }
          });
          try { if (inputCalc.focusFirstExpression) inputCalc.focusFirstExpression(); } catch (e) {}
        } catch (err) {
          inputCalc = null;
          console.warn('desmos input init failed', err);
        }
      } else if (tries > 120) {
        clearInterval(iv);
      }
    }, 100);
  }
  initInputCalc();

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'dcg-insert') return;
    doInsert();
  });

  function doInsert() {
    if (!inputCalc) { postError('函数绘图器尚未就绪，请稍候再试'); return; }
    var list = [];
    try { list = (inputCalc.getState().expressions || {}).list || []; } catch (err) { postError('读取表达式失败'); return; }
    var latexList = [];
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      if (it && it.type === 'expression' && it.latex && it.visible !== false) {
        latexList.push(String(it.latex).trim());
      }
    }
    if (!latexList.length) { postError('请先输入函数表达式'); return; }

    // 离屏输出计算器：透明背景、很透明白色的网格/坐标轴、白色曲线，与可见输入区相互独立
    var div = document.createElement('div');
    div.style.cssText = 'position:fixed;left:-12000px;top:0;width:1000px;height:720px;';
    document.body.appendChild(div);
    var out;
    try {
      out = window.Desmos.GraphingCalculator(div, {
        expressions: false,
        settings: {
          // 透明背景，网格/坐标轴使用半透明白色
          backgroundColor: 'transparent',
          transparentBackground: true,
          textColor: 'rgba(255,255,255,0.35)',
          gridColor: 'rgba(255,255,255,0.25)',
          axisColor: 'rgba(255,255,255,0.4)',
          xAxisNumbers: false,
          yAxisNumbers: false,
          polarNumbers: false,
          arrows: false,
          labels: false,
          degreeMode: false
        }
      });
    } catch (err) { postError('初始化渲染引擎失败'); return; }

    var tries = 0;
    var iv = setInterval(function () {
      tries++;
      var ok = false;
      try { ok = !!out && typeof out.screenshot === 'function' && typeof out.setExpression === 'function'; } catch (e) { ok = false; }
      if (ok) {
        clearInterval(iv);
        finishInsert(out, latexList, div);
      } else if (tries > 60) {
        clearInterval(iv);
        postError('渲染引擎加载超时');
      }
    }, 150);
  }

  function finishInsert(out, latexList, div) {
    try {
      for (var i = 0; i < latexList.length; i++) {
        out.setExpression({ id: 'dcgx' + i, latex: latexList[i], color: '#ffffff00', lineWidth: 4, hidden: false });
      }
      out.setGraphSettings({
        backgroundColor: 'transparent',
        transparentBackground: true,
        textColor: 'rgba(255,255,255,0.35)',
        gridColor: 'rgba(255,255,255,0.25)',
        axisColor: 'rgba(255,255,255,0.4)',
        xAxisNumbers: false,
        yAxisNumbers: false,
        polarNumbers: false,
        arrows: false,
        labels: false,
        degreeMode: false
      });
    } catch (err) { postError('生成图像失败'); return; }

    // 给表达式一帧渲染时间后再截图，避免空白
    setTimeout(function () {
      var dataUrl = null;
      try {
        dataUrl = out.screenshot({
          mode: 'contain',
          width: 1000,
          height: 720,
          targetPixelRatio: 2,
          transparentBackground: true,
          margin: 12
        });
      } catch (e) { dataUrl = null; }
      // 兜底：个别参数不兼容时用最小参数重试
      if (!dataUrl) {
        try {
          dataUrl = out.screenshot({ mode: 'contain', width: 1000, height: 720, targetPixelRatio: 2, transparentBackground: true, margin: 12 });
        } catch (e) { dataUrl = null; }
      }
      try { out.destroy(); } catch (e) {}
      if (div.parentNode) div.parentNode.removeChild(div);
      if (dataUrl) {
        // latexList 供父页面创建白板上的可交互活图（widget）；dataUrl 作为兜底静态图
        window.parent.postMessage({ type: 'dcg-screenshot', dataUrl: dataUrl, latexList: latexList }, '*');
      } else {
        postError('生成图像失败');
      }
    }, 60);
  }

  function postError(msg) {
    try { window.parent.postMessage({ type: 'dcg-error', msg: msg }, '*'); } catch (e) {}
  }
})();
</script>

<!-- 7) widget 模式：在白板上作为可交互活图使用（只渲染图形，拖动平移/滚轮缩放为 desmos 原生行为） -->
<script>
(function () {
  if (!window.__dcgWidgetMode) return;
  document.documentElement.classList.add('widget-mode');
  var q = (window.location.search || '').slice(1);
  var params = {};
  q.split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i > 0) params[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  var exprs = (params.expr || '').split('\u0001').filter(function (s) { return s && String(s).trim(); });
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    if (window.Desmos && typeof window.Desmos.GraphingCalculator === 'function') {
      clearInterval(iv);
      try {
        var el = document.getElementById('dcgInputCalc');
        if (!el) {
          el = document.createElement('div');
          el.style.cssText = 'position:fixed;left:0;right:0;top:0;bottom:0;';
          document.body.appendChild(el);
        }
        var calc = window.Desmos.GraphingCalculator(el, {
          expressions: false,
          settings: {
            // 透明背景，网格/坐标轴使用半透明白色
            backgroundColor: 'transparent',
            transparentBackground: true,
            showGrid: true,
            showXAxis: true,
            showYAxis: true,
            textColor: 'rgba(255,255,255,0.35)',
            gridColor: 'rgba(255,255,255,0.32)',
            axisColor: 'rgba(255,255,255,0.48)',
            xAxisNumbers: false,
            yAxisNumbers: false,
            polarNumbers: false,
            arrows: false,
            labels: false,
            degreeMode: false
          }
        });
        exprs.forEach(function (lt, i) {
          try { calc.setExpression({ id: 'w' + i, latex: lt, color: '#ffffff00fff', lineWidth: 4, hidden: false }); } catch (e) {}
        });
        // 初始视野缩放到能容纳全部曲线
        try {
          if (typeof calc.setMathBounds === 'function') {
            calc.setMathBounds({ left: -10, right: 10, top: 10, bottom: -10 });
          }
        } catch (e) {}
        window.__dcgWidgetCalc = calc;
      } catch (e) {}
    } else if (tries > 120) {
      clearInterval(iv);
    }
  }, 100);
})();
</script>
