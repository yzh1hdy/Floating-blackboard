/* ============ 卷积神经网络前向传播（LeNet 风格，MNIST 训练） ============ */
function conv1(input) {
  const out = new Float32Array(6 * 24 * 24);
  for (let f = 0; f < 6; f++) {
    const wb = f * 25;
    for (let i = 0; i < 24; i++) for (let j = 0; j < 24; j++) {
      let s = CNN_CONV1B[f];
      for (let di = 0; di < 5; di++) for (let dj = 0; dj < 5; dj++)
        s += input[(i + di) * 28 + (j + dj)] * CNN_CONV1W[wb + di * 5 + dj];
      out[f * 576 + i * 24 + j] = s > 0 ? s : 0;
    }
  }
  return out;
}
function pool1(a) {
  const out = new Float32Array(6 * 12 * 12);
  for (let f = 0; f < 6; f++) for (let i = 0; i < 12; i++) for (let j = 0; j < 12; j++) {
    let m = -1e9;
    for (let di = 0; di < 2; di++) for (let dj = 0; dj < 2; dj++) {
      const v = a[f * 576 + (i * 2 + di) * 24 + (j * 2 + dj)];
      if (v > m) m = v;
    }
    out[f * 144 + i * 12 + j] = m;
  }
  return out;
}
function conv2(p) {
  const out = new Float32Array(16 * 8 * 8);
  for (let f = 0; f < 16; f++) {
    const wb = f * 150;
    for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
      let s = CNN_CONV2B[f];
      for (let c = 0; c < 6; c++) for (let di = 0; di < 5; di++) for (let dj = 0; dj < 5; dj++)
        s += p[c * 144 + (i + di) * 12 + (j + dj)] * CNN_CONV2W[wb + c * 25 + di * 5 + dj];
      out[f * 64 + i * 8 + j] = s > 0 ? s : 0;
    }
  }
  return out;
}
function pool2(a) {
  const out = new Float32Array(16 * 4 * 4);
  for (let f = 0; f < 16; f++) for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    let m = -1e9;
    for (let di = 0; di < 2; di++) for (let dj = 0; dj < 2; dj++) {
      const v = a[f * 64 + (i * 2 + di) * 8 + (j * 2 + dj)];
      if (v > m) m = v;
    }
    out[f * 16 + i * 4 + j] = m;
  }

function fc(input, W, b, outn) {
  const out = new Float32Array(outn);
  for (let o = 0; o < outn; o++) {
    let s = b[o];
    const wb = o * input.length;
    for (let i = 0; i < input.length; i++) s += input[i] * W[wb + i];
    out[o] = s > 0 ? s : 0;

  return out;

/* ============ 移除指定数字（4、5、8）的权重 ============
   本程序按"一笔一数字"识别；数字 4、5 通常需两笔写完，单笔识别不可靠；
   数字 8 按需求永久禁用。这里在最终输出层把这几类的 logit 置为 -∞，
   使 softmax 概率恒为 0，模型永不会把某个笔画识别成 4、5 或 8

const DISABLED_DIGITS = [4, 5, 8];

function softmax10(input) {

  for (let k = 0; k < 10; k++) { z[k] = Math.exp(z[k] - mx); total += z[k]; }

  const board = document.getElementById('board');
  const ctx = board.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = 400, H = 160;
  const PEN = { color: '#ffffff', width: 2.5 };   // 白板默认笔宽

  const TARGET = '0721';
  const bgImage = new Image();
  bgImage.src = 'xm.png';
  bgImage.onload = () => { if (typeof strokes !== 'undefined' && strokes.length === 0) paintBackground(); };
  let strokes = [];
  let drawing = false;
  let points = [];
  let pendingPoints = [];
  let lastX = 0, lastY = 0;
  let isDrawingFrame = false;
  let resultVisible = false;
  let exiting = false;   // 口令正确进入退出流程后置位，禁止再次书写/识别
  let failTimer = null;   // 失败提示0.5s的计时器

  const hint = document.getElementById('hint');
  const DEFAULT_HINT = '       在此书写退出口令';
  function hideHint() { hint.classList.add('hidden'); }
  function showHint() { hint.classList.remove('hidden'); }

  function setup() {
    board.width = Math.round(W * dpr);
    board.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    paintBackground();
  }
  function paintBackground() {
    if (bgImage.complete && bgImage.naturalWidth > 0) {
      ctx.drawImage(bgImage, 0, 0, W, H);
    } else {
      ctx.fillStyle = '#0f261e';
      ctx.fillRect(0, 0, W, H);
    }
  }
  function localXY(e) {
    const r = board.getBoundingClientRect();
    return {
      x: Math.min(Math.max(0, e.clientX - r.left), W),
      y: Math.min(Math.max(0, e.clientY - r.top), H)
    };
  }

  function startStroke(x, y) {
    if (exiting) return;
    if (resultVisible) { clearAll(); resultVisible = false; }
    hideHint();
    drawing = true;
    points = [{ x, y }];
    pendingPoints = [{ x, y }];
    lastX = x; lastY = y;
    ctx.lineWidth = PEN.width;
    ctx.strokeStyle = PEN.color;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x, y);
    ctx.stroke();
    if (!isDrawingFrame) { isDrawingFrame = true; requestAnimationFrame(drawFrame); }
  }
  function onMove(x, y) {
    if (!drawing) return;
    pendingPoints.push({ x, y });
  }
  function drawFrame() {
    if (!drawing && pendingPoints.length === 0) { isDrawingFrame = false; return; }
    if (pendingPoints.length > 0 && drawing) {
      const pts = pendingPoints.splice(0);
      ctx.lineWidth = PEN.width;
      ctx.strokeStyle = PEN.color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      for (let i = 0; i < pts.length; i++) {
        const point = pts[i];
        points.push(point);
        if (i > 0) {
          const prev = pts[i - 1];
          const midX = (prev.x + point.x) / 2, midY = (prev.y + point.y) / 2;
          ctx.quadraticCurveTo(prev.x, prev.y, midX, midY);
        }
      }
      const last = pts[pts.length - 1];
      ctx.lineTo(last.x, last.y);
      ctx.stroke();
      lastX = last.x; lastY = last.y;
    }
    requestAnimationFrame(drawFrame);
  }
  function endStroke() {
    if (!drawing) return;
    drawing = false;
    if (points.length > 0) strokes.push(points.slice());
    points = [];
    pendingPoints = [];
    ctx.beginPath();
    if (strokes.length >= 4) setTimeout(detect, 120);
  }

  /* ============ 识别：单笔画裁剪（按墨迹缩放） + 质心对齐 + 二值膨胀加粗 ============ */
  function getBoardData() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const data = ctx.getImageData(0, 0, board.width, board.height).data;
    ctx.restore();
    return data;
  }
  // 二值膨胀两遍：把细笔迹加粗，使形状清晰、贴近训练分布
  function dilateAndNorm(img) {
    const a = new Float32Array(784);
    for (let i = 0; i < 784; i++) a[i] = img[i * 4] / 255 > 0.2 ? 1 : 0;
    for (let pass = 0; pass < 2; pass++) {
      const b = new Float32Array(784);
      for (let y = 0; y < 28; y++) for (let x = 0; x < 28; x++) {
        const idx = y * 28 + x;
        if (a[idx] === 1) { b[idx] = 1; continue; }
        let any = false;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= 28 || ny >= 28) continue;
          if (a[ny * 28 + nx] === 1) { any = true; break; }
        }
        b[idx] = any ? 1 : 0;
      }
      a.set(b);
    }
    return a;
  }
  function cropStroke(stroke, data, Wd, Hd) {
    // 墨迹包围盒（数字本身，不含边距）
    let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
    for (const p of stroke) {
      if (p.x < minX) minX = p.x;
      if (p.x > maxX) maxX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maxY) maxY = p.y;
    }
    const bw = maxX - minX, bh = maxY - minY;
    if (bw <= 0 || bh <= 0) return -1;
    const pad = Math.max(bw, bh) * 0.25 + 8;
    let sx = Math.max(0, minX - pad), sy = Math.max(0, minY - pad);
    let sw = Math.min(bw + 2 * pad, W - sx), sh = Math.min(bh + 2 * pad, H - sy);

    let sxr = Math.max(0, Math.round(sx * dpr)), syr = Math.max(0, Math.round(sy * dpr));
    let swr = Math.min(Wd - sxr, Math.round(sw * dpr)), shr = Math.min(Hd - syr, Math.round(sh * dpr));
    if (swr <= 0 || shr <= 0) return -1;

    // 墨水质心（白板坐标）
    let sxm = 0, sym = 0, cnt = 0;
    for (let y = 0; y < shr; y++) {
      const row = (syr + y) * Wd;
      for (let x = 0; x < swr; x++) {
        if (data[(row + sxr + x) * 4] > 140) { sxm += x; sym += y; cnt++; }
      }
    }
    let cmx, cmy;
    if (cnt > 0) { cmx = (sxr + sxm / cnt) / dpr; cmy = (syr + sym / cnt) / dpr; }
    else { cmx = sx + sw / 2; cmy = sy + sh / 2; }

    // 关键：缩放基准用数字墨迹 (bw,bh)，保证数字在 28x28 中占 ~20px（而非只占十几px）
    const target = 20, scale = target / Math.max(bw, bh);
    const dw = sw * scale, dh = sh * scale;
    const dx = 14 - (cmx - sx) * scale, dy = 14 - (cmy - sy) * scale;

    const out = document.createElement('canvas');
    out.width = 28; out.height = 28;
    const octx = out.getContext('2d');
    octx.imageSmoothingEnabled = true;
    octx.imageSmoothingQuality = 'high';
    octx.fillStyle = '#000';
    octx.fillRect(0, 0, 28, 28);
    octx.drawImage(board, sxr, syr, swr, shr, dx, dy, dw, dh);
    const img = octx.getImageData(0, 0, 28, 28).data;
    const input = dilateAndNorm(img);
      return dilateAndNorm(img);
}
function recognizeStroke(stroke, data, Wd, Hd) {
  const input = cropStroke(stroke, data, Wd, Hd);
  if (!input) return -1;
  return predictDigit(input);
}
function recognizeStrokeProbs(stroke, data, Wd, Hd) {
  const input = cropStroke(stroke, data, Wd, Hd);
  if (!input) return null;
  return softmax10(input);
}

  // 统一向宿主(webview)上报消息，契约固定为 {type, ...} 的JSON字符串
  // 若直接在浏览器中运行（无 webview），则把每次上报/判断结果输出到控制台
  function notifyHost(type, payload) {
    const msg = Object.assign({ type: type }, payload || {});
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage(JSON.stringify(msg));
    } else {
      console.log('[手写检测] 上报:', JSON.stringify(msg));
    }
  }

  // 口令正确后的退出序列：播放同目录 exit.mp3，同时笔迹0.5s渐变消失、提示文本变为"即将退出"，
  // 音频播放完成（或加载/播放失败）后再通知宿主退出程序
  function startExitSequence() {
    // 提示文本变为"即将退出"
    hint.textContent = '即将退出';
    hint.classList.remove('hidden');
    // 笔迹0.5s渐变消失：对画板做透明度过渡（背景与笔迹同层，一并淡出）
    board.style.transition = 'opacity 0.5s ease';
    board.style.opacity = '0';
    // 播放同目录下音频 exit.mp3
    let audio = null;
    try { audio = new Audio('exit.mp3'); } catch (e) { audio = null; }
    let notified = false;
    const done = function () {
      if (notified) return;
      notified = true;
      notifyHost('verifyResult', { ok: true });
    };
    if (audio) {
      audio.volume = 1;
      audio.addEventListener('ended', done);
      audio.addEventListener('error', done);
      audio.play().catch(done); // 若自动播放被拒/加载失败，仍保证最终通知宿主
    } else {
      done();
    }
  }

  function detect() {
  const data = getBoardData();
  const Wd = board.width, Hd = board.height;
  const sorted = strokes.slice().sort((a, b) => centroidX(a) - centroidX(b));
  const probList = sorted.map(s => recognizeStrokeProbs(s, data, Wd, Hd));
  // 展示用：取概率最高者
  const got = probList.map(p => (p ? String(argmaxIndex(p)) : '?')).join('');
  const ok = verifyResult(probList);
  // 调试：控制台输出每个笔画的预测概率与最终判定
  try {
    const detail = probList.map((p, i) => p
      ? { stroke: i, predict: argmaxIndex(p), probs: Array.from(p).map(v => Number(v.toFixed(4))) }
      : { stroke: i, predict: '?', probs: null });
    console.log('[手写检测] 识别为 "' + got + '" 判定=' + (ok ? '正确' : '错误') + ' 各笔画概率:', detail);
  } catch (e) { console.log('[手写检测]', got, ok); }
  drawResult(ok, got);
  resultVisible = true;
  if (ok) {
    // 正确：播放同目录下 exit.mp3，同时笔迹0.5s渐变消失、提示文本变为"即将退出"，
    // 音频播放完成后再通知宿主退出程序
    exiting = true;
    startExitSequence();
  } else {
    // 错误：先显示“口令错误”0.5s，再通知宿主（避免窗口立刻关闭看不到提示）
    failTimer = setTimeout(function () {
      failTimer = null;
      notifyHost('verifyResult', { ok: false });
    }, 500);
  }
}

// ===== 判定规则：目标数字只需排进概率前 ACCEPT_TOP 名即算该位正确，
//      无论其概率高低（"不管其概率是多少，都认为正确"）=====
const ACCEPT_TOP = 2;        // 目标数字在前 N 名内即接受
function argmaxIndex(p) {
  let top = 0;
  for (let k = 1; k < 10; k++) if (p[k] > p[top]) top = k;
  return top;
}
function verifyResult(probList) {
  if (!probList || probList.length !== TARGET.length) return false;
  // 各位置识别出的数字（取概率最高者），与识别展示一致
  const recognized = probList.map(p => (p ? argmaxIndex(p) : -1));
  // 新增容错：识别结果为 0821 / 0828 时，也直接判为正确（解决易被误识成 0821/0828 的问题）
  const gotStr = recognized.map(n => (n < 0 ? '?' : String(n))).join('');
  if (gotStr === '0821' || gotStr === '0828') return true;
  // 新增容错：识别结果与目标 0721 相比，若仅有 1~2 位不符、且这些不符的位识别为"2"，则按正确处理
  //（解决 7 常被误判成 2、导致 0721 被识别为 0221 等的情况）
  let mismatchCount = 0;
  let mismatchAllTwo = true;
  for (let i = 0; i < TARGET.length; i++) {
    if (recognized[i] !== +TARGET[i]) {
      mismatchCount++;
      if (recognized[i] !== 2) mismatchAllTwo = false;
    }
  }
  if (mismatchCount >= 1 && mismatchCount <= 2 && mismatchAllTwo) {
    return true;
  }
  // 逐位判定：目标数字只要排进概率前 ACCEPT_TOP 名即算该位正确，
  // 不设概率下限、不看与第一名差距（"不管其概率是多少，都认为正确"）
  for (let i = 0; i < TARGET.length; i++) {
    const p = probList[i];
    if (!p) return false;
    const expected = +TARGET[i];
    // 前 ACCEPT_TOP 名内，接受
    let better = 0;
    for (let k = 0; k < 10; k++) if (p[k] > p[expected]) better++;
    if (better < ACCEPT_TOP) continue;
    return false;
  }
  return true;
}
  function centroidX(stroke) {
    let s = 0;
    for (const p of stroke) s += p.x;
    return s / stroke.length;
  }

  function drawResult(ok, got) {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = 'rgba(15,38,30,0.92)';
    const bx = W / 2 - 90, by = H - 46, bw2 = 180, bh2 = 40;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw2, bh2, 10);
    ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = ok ? '#4ade8000' : '#f87171';
    ctx.font = 'bold 26px sans-serif';
    ctx.fillText(ok ? '对  ✔' : '口令错误', W / 2, by + 19);
    ctx.fillStyle = 'rgba(255,255,255,0)';
    ctx.font = '16px sans-serif';
    ctx.fillText('识别为 ' + got, W / 2, by + bh2 - 6);
    ctx.restore();
  }

  function clearAll() {
    strokes = [];
    if (failTimer) { clearTimeout(failTimer); failTimer = null; }
    hint.textContent = DEFAULT_HINT;
    board.style.transition = '';
    board.style.opacity = '';
    paintBackground();
    showHint();
  }

  /* 事件：鼠标 + 触摸 */
  // 中键快速连点三次：直接触发“判断正确”（跳过识别，直接走通过流程）
  let middleClickCount = 0;
  let middleClickTimer = null;
  const MIDDLE_CLICK_WINDOW = 800; // 毫秒窗口内计为“快速连点”
  function onMiddleClick() {
    if (exiting) return;
    middleClickCount++;
    clearTimeout(middleClickTimer);
    middleClickTimer = setTimeout(() => { middleClickCount = 0; }, MIDDLE_CLICK_WINDOW);
    if (middleClickCount < 3) return;
    // 达到三次：清掉计数与失败提示，直接判定通过
    middleClickCount = 0;
    clearTimeout(middleClickTimer);
    if (failTimer) { clearTimeout(failTimer); failTimer = null; }
    exiting = true;
    resultVisible = true;
    drawResult(true, '强制通过');
    startExitSequence();
  }
  board.addEventListener('mousedown', (e) => {
    e.preventDefault();
    if (e.button === 1) { onMiddleClick(); return; } // 中键不落笔，仅用于快速三击
    const p = localXY(e);
    startStroke(p.x, p.y);
  });
  board.addEventListener('mousemove', (e) => { if (drawing) { const p = localXY(e); onMove(p.x, p.y); } });
  window.addEventListener('mouseup', endStroke);

  board.addEventListener('touchstart', (e) => { e.preventDefault(); const t = e.changedTouches[0]; const p = localXY({ clientX: t.clientX, clientY: t.clientY }); startStroke(p.x, p.y); }, { passive: false });
  board.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.changedTouches[0]; const p = localXY({ clientX: t.clientX, clientY: t.clientY }); onMove(p.x, p.y); }, { passive: false });
  board.addEventListener('touchend', (e) => { e.preventDefault(); endStroke(); }, { passive: false });
  board.addEventListener('touchcancel', (e) => { e.preventDefault(); endStroke(); }, { passive: false });

  // 右上角关闭按钮：不做实际功能
  document.getElementById('closeBtn').addEventListener('click', function () {
    // 点击右上角关闭：通知宿主取消退出（不退出程序）
    notifyHost('verifyCancel');
  });

  setup();
})();
</script>
</body>
</html>
